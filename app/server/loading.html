<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞牛桌面管理工具 - 加载中</title><link rel="icon" href="favicon.ico" type="image/x-icon"><link href="./fonts/font-awesome.min.css" rel="stylesheet"><style>:root{--primary-color:#0a192f;--secondary-color:#112240;--accent-color:#00aeff;--text-primary:#e6f1ff;--text-secondary:#e6f1ff;--border-color:#233554;--highlight-color:#4cc9f0;--error-color:#f87171;--success-color:#4ade80;--card-bg:rgba(9, 20, 37, 0.8);--input-bg:rgba(10, 25, 47, 0.7)}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}body{min-height:100vh;background-color:var(--primary-color);background-size:cover;background-position:center;background-repeat:no-repeat;color:var(--text-primary);display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}body::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 50% 50%,rgba(100,255,218,.05) 0,rgba(30,41,59,0) 70%);pointer-events:none}.loading-container{background:rgba(7,0,102,.226);backdrop-filter:blur(3px);border:1px solid var(--border-color);border-radius:8px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.3),0 0 0 1px rgba(100,255,218,.1);position:relative;z-index:1;overflow:hidden;transition:all .3s ease,transform .3s ease,box-shadow .3s ease;display:flex;flex-direction:column;align-items:center;gap:1.5rem}.loading-container:hover{background:var(--card-bg);backdrop-filter:blur(10px)}.loading-container::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent-color),transparent)}.loading-container:hover{transform:translateY(-5px);box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 1px rgba(100,255,218,.2),0 0 30px rgba(100,255,218,.1)}.loading-header{text-align:center}.loading-title{font-size:2rem;color:var(--accent-color);margin-bottom:.5rem;letter-spacing:1px;text-shadow:0 0 10px rgba(100,255,218,.3)}.main-container{display:flex;justify-content:center;align-items:center;height:100%;width:100%;transform:scale(3);transform-origin:center;margin:15px 0}.loader{width:100%;max-width:200px}.trace-bg{stroke:#252525;stroke-width:1.8;fill:none}.trace-flow{stroke-width:1.8;fill:none;stroke-dasharray:40 400;stroke-dashoffset:438;filter:drop-shadow(0 0 6px currentColor);animation:flow 3s cubic-bezier(.5,0,.9,1) infinite}.blue2{stroke:var(--accent-color);color:var(--accent-color)}.blue{stroke:var(--highlight-color);color:var(--highlight-color)}@keyframes flow{to{stroke-dashoffset:0}}.loading-progress{width:320px;height:12px;background-color:var(--border-color);border-radius:6px;overflow:hidden;margin:1rem 0}.loading-bar{height:100%;background:linear-gradient(90deg,var(--accent-color),var(--highlight-color));border-radius:3px;width:0%;animation:progress 2s ease-in-out infinite}@keyframes progress{0%{width:0%}50%{width:70%}100%{width:100%}}.loading-text{background:rgba(0,174,255,.06);border:1px solid rgba(0,174,255,.2);border-radius:12px;padding:10px 24px;margin-top:10px;text-align:left;color:silver;font-size:.95rem;line-height:1.8}.loading-text-header{display:block;color:var(--accent-color);font-weight:700;font-size:.95em;margin-bottom:2px}.loading-text-step{display:flex;align-items:center;gap:6px;color:#d4d4d4}.loading-text-step .step-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-color);box-shadow:0 0 6px var(--accent-color);flex-shrink:0}.notready-container{display:none;flex-direction:column;align-items:center;gap:1.5rem;text-align:center;width:100%}.notready-icon{font-size:3rem;color:var(--error-color)}.notready-text{color:var(--text-primary);font-size:1.1rem;line-height:1.7}.notready-hint{color:#888;font-size:.9rem;margin-top:4px}.btn-retry{padding:.6rem 1.8rem;background:var(--accent-color);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:1rem;transition:all .2s}.btn-retry:hover{background:var(--highlight-color);transform:scale(1.05)}.notready-buttons{display:flex;gap:1rem;justify-content:center}.btn-restore{padding:.6rem 1.8rem;background:var(--error-color);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:1rem;transition:all .2s}.btn-restore:hover{background:#ef4444;transform:scale(1.05)}.mismatch-container{display:none;flex-direction:column;align-items:center;gap:1rem;text-align:center}.mismatch-buttons{display:flex;gap:1rem;justify-content:center;width:100%}.mismatch-text{color:var(--error-color);font-size:1.2em;font-weight:700;line-height:1.6}.mismatch-version-box{margin-top:12px;padding:10px 20px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:8px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;font-family:Consolas,'Courier New',monospace;font-size:.8em;font-weight:700;color:#d4d4d4}.mismatch-version-box .mismatch-version-label{color:#a0a0a0}.btn-know{padding:.6rem 1.5rem;background:var(--accent-color);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;transition:all .2s}.btn-know:hover{background:var(--highlight-color);transform:scale(1.05)}.btn-force{padding:.6rem 1.5rem;background:var(--error-color);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.9rem;opacity:.8}.btn-force:hover{background:#ef4444;transform:scale(1.05);opacity:1}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:1000;justify-content:center;align-items:center}.modal-content{background:var(--secondary-color);border:1px solid var(--border-color);border-radius:8px;padding:2rem;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:modalFadeIn .3s ease-out}@keyframes modalFadeIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}.modal-message{margin-bottom:1.5rem;line-height:1.6;color:var(--text-primary);font-size:1rem}.modal-buttons{display:flex;gap:1rem;justify-content:center}.modal-btn{padding:.5rem 1.5rem;border-radius:4px;cursor:pointer;font-weight:600;border:none;transition:all .2s;font-size:.9rem}.btn-cancel{background:rgba(255,255,255,.1);color:var(--text-secondary)}.btn-confirm{background:var(--error-color);color:#fff}.modal-btn:hover{transform:scale(1.05);filter:brightness(1.2)}.restore-auth-hint{color:var(--text-primary);font-size:.9rem;margin-bottom:.6rem;line-height:1.5;min-height:1.4em}.restore-password-input{width:100%;padding:.6rem .8rem;margin-bottom:1.2rem;background:var(--input-bg);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;font-size:.95rem;outline:0;transition:border-color .2s}.restore-password-input:focus{border-color:var(--accent-color)}.system-info{margin-top:1rem;text-align:center;font-size:.8rem;opacity:.8}@media (max-width:768px){.loading-container{margin:1rem;padding:2rem;width:calc(100% - 2rem);max-width:400px}.loading-title{font-size:1.75rem}.loader{max-width:150px}}</style></head><body><div id="loading-container" class="loading-container"><div class="loading-header"><h1 class="loading-title">飞牛桌面管理工具</h1></div><div id="normal-loading"><div class="main-container"><div class="loader"><svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="chipGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d2d2d"></stop><stop offset="100%" stop-color="#0f0f0f"></stop></linearGradient><linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eeeeee"></stop><stop offset="100%" stop-color="#888888"></stop></linearGradient><linearGradient id="pinGradient" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="#bbbbbb"></stop><stop offset="50%" stop-color="#888888"></stop><stop offset="100%" stop-color="#555555"></stop></linearGradient></defs><g id="traces"><path d="M230 150 H300 V210 H326" class="trace-bg"></path><path d="M230 150 H300 V210 H326" class="trace-flow blue2"></path><path d="M210 180 H280 V230 H326" class="trace-bg"></path><path d="M210 180 H280 V230 H326" class="trace-flow blue"></path><path d="M190 260 H250 V250 H326" class="trace-bg"></path><path d="M190 260 H250 V250 H326" class="trace-flow blue2"></path><path d="M230 310 H300 V270 H326" class="trace-bg"></path><path d="M230 310 H300 V270 H326" class="trace-flow blue"></path><path d="M570 140 H510 V210 H474" class="trace-bg"></path><path d="M570 140 H510 V210 H474" class="trace-flow blue"></path><path d="M590 190 H530 V230 H474" class="trace-bg"></path><path d="M590 190 H530 V230 H474" class="trace-flow blue2"></path><path d="M580 250 H540 V250 H474" class="trace-bg"></path><path d="M580 250 H540 V250 H474" class="trace-flow blue"></path><path d="M570 300 H520 V270 H474" class="trace-bg"></path><path d="M570 300 H520 V270 H474" class="trace-flow blue2"></path></g><rect x="330" y="190" width="140" height="100" rx="20" ry="20" fill="url(#chipGradient)" stroke="#222" stroke-width="3" filter="drop-shadow(0 0 6px rgba(0,0,0,0.8))"></rect><g><rect x="322" y="205" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect><rect x="322" y="225" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect><rect x="322" y="245" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect><rect x="322" y="265" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect></g><g><rect x="470" y="205" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect><rect x="470" y="225" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect><rect x="470" y="245" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect><rect x="470" y="265" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect></g><text x="400" y="240" font-family="Arial, sans-serif" font-size="32" fill="url(#textGradient)" text-anchor="middle" alignment-baseline="middle">fnOS</text><circle cx="230" cy="150" r="5" fill="black"></circle><circle cx="210" cy="180" r="5" fill="black"></circle><circle cx="190" cy="260" r="5" fill="black"></circle><circle cx="230" cy="310" r="5" fill="black"></circle><circle cx="570" cy="140" r="5" fill="black"></circle><circle cx="590" cy="190" r="5" fill="black"></circle><circle cx="580" cy="250" r="5" fill="black"></circle><circle cx="570" cy="300" r="5" fill="black"></circle></svg></div></div><div class="loading-progress"><div class="loading-bar"></div></div><div class="loading-text"><span class="loading-text-header">请稍候...正在初始化：</span> <span class="loading-text-step"><span class="step-dot"></span>1. 系统启动不足三分钟</span> <span class="loading-text-step"><span class="step-dot"></span>2. 正在配置个性化设置</span> <span class="loading-text-step"><span class="step-dot"></span>3. 正在升级 Fndesk 程序</span></div></div><div id="notready-loading" class="notready-container"><div class="notready-icon"><i class="fa fa-exclamation-circle"></i></div><div><div class="notready-text">飞牛健康检查不通过</div><div class="notready-hint">Fndesk检测到飞牛系统文件不理想<br>安全起见，暂时无法完成初始化<br>请尝试重启Fndesk 或 重新飞牛后再试</div></div><div class="notready-buttons"><button class="btn-retry" onclick="restartFndesk()">重启Fndesk</button> <button class="btn-restore" onclick="confirmEmergencyRestore()">紧急还原</button></div></div><div id="mismatch-loading" class="mismatch-container"><div class="mismatch-text">执行版本不同，作者暂未亲测<br>若飞牛改动不大，可尝试执行<br><span class="mismatch-version-box"><span><span class="mismatch-version-label">飞 牛 版 本</span>：<span id="fnosVersionDisplay">获取中...</span></span> <span><span class="mismatch-version-label">Fndesk版本</span>：<span id="fndeskVersionDisplay">获取中...</span></span></span></div><div class="mismatch-buttons"><button class="btn-force" onclick="confirmForceExecute()">抢先执行</button> <button class="btn-know" onclick="forceReady()">稍后再试</button></div></div><div class="system-info">by 米恋泥 @小宠瞭望塔</div></div><div id="confirm-modal" class="modal-overlay"><div class="modal-content"><div class="modal-message">若执行后发生不兼容的情况<br>随时使用一键还原恢复原设</div><div class="modal-buttons"><button class="modal-btn btn-cancel" onclick="closeConfirmModal()">我再想想</button> <button class="modal-btn btn-confirm" onclick="doForceExecute()">直接执行</button></div></div></div><div id="restore-modal" class="modal-overlay"><div class="modal-content"><div class="modal-message">系统可能未初始化完成<br>建议先重启 Fndesk 再试</div><div id="restore-auth-area"><div id="restore-auth-hint" class="restore-auth-hint"></div><input id="restore-password-input" type="password" class="restore-password-input" placeholder="请输入Fndesk密码" autocomplete="off"></div><div class="modal-buttons"><button class="modal-btn btn-cancel" onclick="closeRestoreModal()">返回重启</button> <button class="modal-btn btn-confirm" id="restore-confirm-btn" onclick="doEmergencyRestore()">执行还原</button></div></div></div><script>let backgroundApiUrl_img="https://t.alcy.cc/fj";let backgroundApiUrl_video="https://t.alcy.cc/acg";let needVideoBackground=true;document.body.style.backgroundImage=`url('${backgroundApiUrl_img}')`;fetch("./api/getFndeskBG",{credentials:"same-origin"}).then(e=>e.ok&&e.json()).then(e=>{if(e&&e.imgUrl){backgroundApiUrl_img=e.imgUrl;backgroundApiUrl_video=e.videoUrl||backgroundApiUrl_video;needVideoBackground=e.needVideo!==false;document.body.style.backgroundImage=`url('${backgroundApiUrl_img}')`}}).catch(e=>console.log("获取背景失败，使用默认背景:",e));document.addEventListener("DOMContentLoaded",function(){function e(){if(!needVideoBackground){return}const e=document.createElement("video");e.src=backgroundApiUrl_video;e.autoplay=true;e.muted=true;e.loop=true;e.playsInline=true;e.style.position="fixed";e.style.top="0";e.style.left="0";e.style.width="100%";e.style.height="100%";e.style.objectFit="cover";e.style.zIndex="0";e.style.opacity="0";e.style.transition="opacity 3s ease";e.oncanplay=function(){e.style.opacity="1"};e.onerror=function(){console.warn("视频加载失败，保持显示背景图");e.remove()};document.body.appendChild(e)}setTimeout(e,3e3);function r(){fetch("./api/system-status",{method:"GET",credentials:"same-origin"}).then(e=>{if(e.ok)return e.json();throw new Error("系统未就绪")}).then(e=>{if(e.ready==="true"){const o=e.targetUrl||"index.html";let t=false;try{t=!!window.parent.document.getElementById("root")}catch(e){t=false}if(t){window.location.href=o}else{window.parent.location.href=o}}else if(e.ready==="unver"){document.getElementById("normal-loading").style.display="none";document.getElementById("mismatch-loading").style.display="flex";const t=document.getElementById("fnosVersionDisplay");const n=document.getElementById("fndeskVersionDisplay");if(t)t.textContent=e.fnosVersion||"未知";if(n)n.textContent=e.fndeskVersion||"未知"}else if(e.ready==="notready"){document.getElementById("normal-loading").style.display="none";document.getElementById("notready-loading").style.display="flex"}else{setTimeout(r,3e3)}}).catch(()=>{setTimeout(r,3e3)})}window.forceReady=function(){fetch("./api/force-ready",{method:"POST",credentials:"same-origin"}).then(e=>e.json()).then(e=>{if(e.success)r()})};window.restartFndesk=async function(){try{const e=await fetch("./api/restart",{method:"POST",credentials:"same-origin"});const t=await e.json();location.reload()}catch(e){alert("重启请求失败: "+e.message)}};window.confirmForceExecute=function(){document.getElementById("confirm-modal").style.display="flex"};window.closeConfirmModal=function(){document.getElementById("confirm-modal").style.display="none"};window.doForceExecute=async function(){closeConfirmModal();document.getElementById("loading-container").style.display="none";try{await fetch("./api/force-ready",{method:"POST",credentials:"same-origin"});fetch("./api/justgo",{method:"POST",credentials:"same-origin"}).catch(e=>console.error("justgo 触发失败:",e));setTimeout(()=>location.reload(),500)}catch(e){setTimeout(()=>location.reload(),1e3)}};window.__restoreAuthMode=0;window.confirmEmergencyRestore=async function(){const e=document.getElementById("restore-modal");const t=document.getElementById("restore-auth-hint");const o=document.getElementById("restore-password-input");const n=document.getElementById("restore-confirm-btn");t.textContent="正在检测密码状态...";t.style.color="";o.value="";o.disabled=true;n.disabled=true;n.textContent="执行还原";e.style.display="flex";try{const r=await fetch("./api/check-password-file",{method:"GET",credentials:"same-origin"});const s=await r.json().catch(()=>({}));if(s.hasPasswordFile){window.__restoreAuthMode=1;t.textContent="请输入 Fndesk 登录密码以继续";o.placeholder="登录密码"}else{window.__restoreAuthMode=2;t.textContent="尚未初始化密码，请设置 6-20 位密码";o.placeholder="设置新密码(6-20位)"}}catch(e){t.textContent="检测失败: "+e.message+"，按登录密码尝试";t.style.color="var(--error-color)";window.__restoreAuthMode=1;o.placeholder="登录密码"}finally{o.disabled=false;n.disabled=false;o.focus()}};window.closeRestoreModal=function(){document.getElementById("restore-modal").style.display="none";document.getElementById("restore-password-input").value="";window.__restoreAuthMode=0};window.doEmergencyRestore=async function(){const e=document.getElementById("restore-password-input");const t=document.getElementById("restore-auth-hint");const o=document.getElementById("restore-confirm-btn");const n=e.value;if(!n){t.textContent="请先填写密码";t.style.color="var(--error-color)";e.focus();return}if(window.__restoreAuthMode===2&&(n.length<6||n.length>20)){t.textContent="密码长度应为 6-20 位";t.style.color="var(--error-color)";return}o.disabled=true;const r=o.textContent;o.textContent="验证中...";try{const s=window.__restoreAuthMode===2?"./api/initialize-password":"./api/login";const a=await fetch(s,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:n})});const i=await a.json().catch(()=>({}));if(!a.ok||i.success===false){t.textContent=i.message||"认证失败";t.style.color="var(--error-color)";o.disabled=false;o.textContent=r;return}o.textContent="还原中...";const d=await fetch("./api/reset-desktop",{method:"POST",credentials:"same-origin"});location.reload();const c=await d.json().catch(()=>({}));if(!d.ok||c.success===false){t.textContent="还原失败: "+(c.message||d.status);t.style.color="var(--error-color)";o.disabled=false;o.textContent=r;return}closeRestoreModal()}catch(e){t.textContent="请求失败: "+e.message;t.style.color="var(--error-color)";o.disabled=false;o.textContent=r}};setTimeout(()=>{r()},2e3)})</script></body></html>
